; WBAT.INI - example configuration for WBAT64's compat mode.
; These are the WBAT 2.50 defaults; edit the values to customise.
[general]
ELvar=1              ; 1 = also set ? to the exit code
rightESC=1           ; right-click outside a box = ESC
ESCinput=0           ; 1 = keep edits on ESC
ErrorPause=1         ; pause on errors when a console is available
BoxFrame="         " ; nine spaces = WBAT's blank frame (1-char margin)
CheckSymbol="x"
RadioSymbol="*"
HiSymbol="~"
SourceFile=wbat.txt
PalFile=+pal.ini

[color]
Screen=   black on +green
Box=      black on +white
BoxHi=    red on +white
TextHi=   red on +green
TextTitle=+white on magenta
Bar=      +white on +red
Button=   black on white
HotKey=   red
Shadow=   +black     ; NONE turns the shadow off
Divider=  cyan       ; background comes from the box
Title=    black on +blue
